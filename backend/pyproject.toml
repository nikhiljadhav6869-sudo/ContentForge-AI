[project]
name = "contentforge-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary,pool]>=3.2,<4", "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "langgraph-checkpoint-postgres>=3,<4",
  "redis>=5,<7", "rq>=2,<3", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "beautifulsoup4>=4.13,<5"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
