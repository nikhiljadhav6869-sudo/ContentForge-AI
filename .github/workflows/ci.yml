name: ContentForge validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_deployment.py
      - name: Validate generated backup schedule without enabling it
        run: |
          python3 scripts/configure_backup_schedule.py --production --output-directory "$RUNNER_TEMP/contentforge-backup-units" --backup-directory "$RUNNER_TEMP/contentforge-backups"
          systemd-analyze verify "$RUNNER_TEMP/contentforge-backup-units/"*.service "$RUNNER_TEMP/contentforge-backup-units/"*.timer
      - name: Validate HTTPS proxy configuration without network access
        run: >-
          docker run --rm --network none -e DOMAIN=studio.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/install.sh
      - run: ./scripts/test.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start services
        run: |
          (cd backend && .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/contentforge-api.log 2>&1) &
          (cd frontend && npm run start > /tmp/contentforge-web.log 2>&1) &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/contentforge-api.log /tmp/contentforge-web.log
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
